<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Happiness Score Predictor</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
  </head>

  <body>
    <div class="card">
      <h1>🌎 World Happiness Score Predictor</h1>
      <p class="subtitle">
        Enter indicators below to estimate the Happiness Score.
      </p>

      <form action="{{ url_for('predic_datapoint') }}" method="post">
        <div class="input-group">
          <label>Year</label>
          <input
            type="number"
            name="Year"
            placeholder="e.g., 2024"
            min="2005"
            max="2024"
            required />
        </div>

        <div class="input-group">
          <label>GDP per Capita (Log Scale)</label>
          <input
            type="number"
            step="0.01"
            name="GDP"
            placeholder="e.g., 9.5"
            min="5.6"
            max="11.9"
            required />
        </div>

        <div class="input-group">
          <label>Social Support</label>
          <input
            type="number"
            step="0.01"
            name="SocialSupport"
            placeholder="e.g., 0.85"
            min="0.23"
            max="0.99"
            required />
        </div>

        <div class="input-group">
          <label>Life Expectancy</label>
          <input
            type="number"
            step="1"
            name="LifeExpectancy"
            placeholder="e.g., 70.2"
            min="25"
            max="80"
            required />
        </div>

        <div class="input-group">
          <label>Freedom</label>
          <input
            type="number"
            step="0.01"
            name="Freedom"
            placeholder="e.g., 0.58"
            min="0.23"
            max="0.99"
            required />
        </div>

        <div class="input-group">
          <label>Generosity</label>
          <input
            type="number"
            step="0.01"
            name="Generosity"
            placeholder="e.g., 0.12"
            min="-0.34"
            max="0.69"
            required />
        </div>

        <div class="input-group">
          <label>Corruption</label>
          <input
            type="number"
            step="0.01"
            name="Corruption"
            placeholder="e.g., 0.20"
            min="0.04"
            max="0.98"
            required />
        </div>

        <button type="submit" class="btn-submit">
          Predict Happiness Score
        </button>
        {% if result %}
        <div class="result-box">Happiness Score: <span>{{ result }}</span></div>
        {% endif %}
      </form>
    </div>
  </body>
</html>
